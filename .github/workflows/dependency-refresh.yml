name: Dependency Refresh

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dependency-refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-refresh-main
  cancel-in-progress: false

jobs:
  remediate:
    name: Install missing build dependency and validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.3.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Add shadcn package required by app/globals.css
        run: pnpm add shadcn@4.23.0

      - name: Apply patched transitive dependency versions
        run: pnpm audit --fix=update --audit-level high

      - name: Install from updated lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify dependency security
        run: pnpm audit --audit-level high

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Production build
        run: pnpm build

      - name: Commit dependency remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml pnpm-workspace.yaml
          if git diff --cached --quiet; then
            echo "No dependency changes required."
            exit 0
          fi
          git commit -m "fix(deps): add shadcn stylesheet dependency"
          git push origin HEAD:main
